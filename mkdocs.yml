site_name: KerbWolf
site_description: Kerberos roasting and TGT attack toolkit for Active Directory
site_url: https://strongwind.dev/KerbWolf/
repo_url: https://github.com/StrongWind1/KerbWolf
repo_name: StrongWind1/KerbWolf
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 - 2026 StrongWind1

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark mode (default) — respects system preference
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light mode — respects system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    # Navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    # Table of contents
    - toc.follow
    # Search
    - search.highlight
    - search.suggest
    - search.share
    # Header
    - header.autohide
    - announce.dismiss
    # Content
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

hooks:
  - hooks/html_validity.py

plugins:
  - search
  # Downloads the Google Fonts requested by theme.font at build time so the
  # published site makes no third-party requests.
  - privacy
  # Pages that moved keep their old address: each entry writes a small page at
  # the old path that forwards to the new one, with any #fragment carried over.
  - redirects:
      redirect_maps:
        getting-started/installation.md: installation.md
        guide/attacks.md: background/attacks.md
        guide/encryption-types.md: background/encryption-types.md
        guide/hashcat-modes.md: cracking/hash-reference.md
        guide/cracking-speed.md: cracking/speed.md
        guide/hashcat-internals.md: cracking/hashcat-internals.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Commands:
      - kw-roast: commands/kw-roast.md
      - kw-asrep: commands/kw-asrep.md
      - kw-timeroast: commands/kw-timeroast.md
      - kw-extract: commands/kw-extract.md
      - kw-tgt: commands/kw-tgt.md
  - Cracking:
      - Hash Reference: cracking/hash-reference.md
      - Cracking Speed: cracking/speed.md
      - Hashcat Internals: cracking/hashcat-internals.md
  - Background:
      - Overview: guide/index.md
      - Attacks in Depth: background/attacks.md
      - Encryption Types: background/encryption-types.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StrongWind1/KerbWolf
      name: KerbWolf on GitHub
  generator: false

extra_css:
  # theme.css is the site palette; primary and accent are both `custom`,
  # so every Material colour variable is defined there.
  - stylesheets/theme.css
  # extra.css widens the content column on large screens and tightens table
  # spacing so wide tables fit before they scroll.
  - stylesheets/extra.css

extra_javascript:
  # a11y.js gives code blocks that scroll sideways a keyboard tab stop.
  - javascripts/a11y.js

strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
